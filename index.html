<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Life OS" />
    <link rel="icon" type="image/svg+xml" href="/LIFE-OS/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/LIFE-OS/apple-touch-icon.png" />
    <title>Life OS</title>
    <script>
      // Применяем тему до загрузки React, чтобы не было «вспышки»
      try {
        var t = localStorage.getItem('lifeos.theme') || 'dark';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        if (localStorage.getItem('lifeos.lowBlur') === '1') document.documentElement.classList.add('low-blur');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
